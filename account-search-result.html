<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>账户查询结果</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="bg-[#e8ecf3] min-h-screen flex items-center justify-center p-6">
  <div class="phone-shell">
    <div class="notch"></div>
    <div class="status-bar bg-white/95"><span>16:22</span><div class="flex gap-1"><i class="fa-solid fa-signal"></i><span>5G</span><i class="fa-solid fa-battery-full"></i></div></div>
    <div class="safe-content px-4 pt-4 pb-4">
      <div class="flex items-center justify-between">
        <h1 class="page-title">账户查询结果</h1>
        <a href="./account-query.html" class="text-sm text-blue-600">返回</a>
      </div>
      <div class="mt-3 bg-white rounded-2xl p-3 shadow-sm text-xs text-slate-500">
        <p>机构：<span id="org" class="text-slate-700"></span></p>
        <p class="mt-1">查询方式：<span id="way" class="text-slate-700"></span> · 查询日期：<span id="qdate" class="text-slate-700"></span></p>
      </div>
      <div class="mt-3 space-y-3 text-sm">
        <div class="bg-white rounded-xl p-3 shadow-sm border border-slate-100">
          <p class="font-semibold text-slate-800">基本户 6222 0000 0000 9938</p>
          <p class="text-xs text-slate-500 mt-1">币种：CNY · 状态：正常 · 开户机构：深圳分行营业部</p>
        </div>
        <div class="bg-white rounded-xl p-3 shadow-sm border border-slate-100">
          <p class="font-semibold text-slate-800">一般户 6214 0000 0000 1102</p>
          <p class="text-xs text-slate-500 mt-1">币种：CNY · 状态：正常 · 开户机构：深圳福田支行</p>
        </div>
      </div>
    </div>
    <div class="tab-bar">
      <a class="tab-item" href="./workbench.html"><i class="fa-solid fa-table-columns text-lg"></i><div>工作台</div></a>
      <a class="tab-item active" href="./customer-center.html"><i class="fa-regular fa-user text-lg"></i><div>客户中心</div></a>
      <a class="tab-item" href="./marketing-center.html"><i class="fa-solid fa-bullhorn text-lg"></i><div>营销中心</div></a>
      <a class="tab-item" href="./process-center.html"><i class="fa-solid fa-diagram-project text-lg"></i><div>流程中心</div></a>
      <a class="tab-item" href="./management-center.html"><i class="fa-solid fa-gear text-lg"></i><div>管理中心</div></a>
      <a class="tab-item" href="./parameter-center.html"><i class="fa-solid fa-sliders text-lg"></i><div>参数中心</div></a>
    </div>
  </div>
  <script>
    const p = new URLSearchParams(window.location.search);
    document.getElementById('org').textContent = p.get('org') || '-';
    document.getElementById('way').textContent = p.get('way') || '-';
    document.getElementById('qdate').textContent = p.get('queryDate') || '-';
  </script>
</body>
</html>
