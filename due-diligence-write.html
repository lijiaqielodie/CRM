<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>尽调智能撰写</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="bg-[#e8ecf3] min-h-screen flex items-center justify-center p-6">
  <div class="phone-shell">
    <div class="notch"></div>
    <div class="status-bar bg-white/95"><span>16:22</span><div class="flex gap-1"><i class="fa-solid fa-signal"></i><span>5G</span><i class="fa-solid fa-battery-full"></i></div></div>
    <div class="safe-content px-4 pt-4 pb-4 overflow-y-auto">
      <div class="flex items-center justify-between">
        <h1 class="page-title">尽调智能撰写</h1>
        <a href="./due-diligence-assistant.html" class="text-sm text-blue-600">返回</a>
      </div>
      <p class="mt-2 text-xs text-slate-500">填写关键要点后生成段落建议；对接大模型后可流式输出。</p>

      <div class="mt-4 space-y-3">
        <div>
          <label class="text-[13px] font-medium text-slate-800">尽调要点 / 素材</label>
          <textarea id="draft-in" rows="8" placeholder="粘贴走访记录、财务要点、风险关注点等…" class="mt-2 w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm text-slate-800 placeholder:text-slate-400 outline-none focus:border-blue-400 resize-none"></textarea>
        </div>
        <button type="button" id="btn-gen" class="w-full py-3 rounded-xl bg-sky-600 text-white text-sm font-semibold active:bg-sky-700">
          生成撰写建议
        </button>
        <div id="out-box" class="hidden rounded-xl border border-slate-200 bg-white p-3 text-sm text-slate-700 leading-relaxed whitespace-pre-wrap"></div>
      </div>
    </div>
    <div class="tab-bar">
      <a class="tab-item active" href="./workbench.html"><i class="fa-solid fa-table-columns text-lg"></i><div>工作台</div></a>
      <a class="tab-item" href="./customer-center.html"><i class="fa-regular fa-user text-lg"></i><div>客户中心</div></a>
      <a class="tab-item" href="./marketing-center.html"><i class="fa-solid fa-bullhorn text-lg"></i><div>营销中心</div></a>
      <a class="tab-item" href="./process-center.html"><i class="fa-solid fa-diagram-project text-lg"></i><div>流程中心</div></a>
      <a class="tab-item" href="./management-center.html"><i class="fa-solid fa-gear text-lg"></i><div>管理中心</div></a>
      <a class="tab-item" href="./parameter-center.html"><i class="fa-solid fa-sliders text-lg"></i><div>参数中心</div></a>
    </div>
  </div>
  <script>
    document.getElementById('btn-gen').addEventListener('click', () => {
      const v = document.getElementById('draft-in').value.trim();
      const box = document.getElementById('out-box');
      box.classList.remove('hidden');
      box.textContent = v
        ? `【示意输出】\n\n根据您录入的要点，建议尽调结论段可依次覆盖：主体资质与沿革、财务状况与现金流、授信方案与用途、担保与第二还款来源、主要风险及缓释措施。以下为扩写占位，对接模型后替换。\n\n——\n${v.slice(0, 400)}${v.length > 400 ? '…' : ''}`
        : '请先输入尽调要点或素材后再试。';
    });
  </script>
</body>
</html>
