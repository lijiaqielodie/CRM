<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>交易明细查询</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="bg-[#e8ecf3] min-h-screen flex items-center justify-center p-6">
  <div class="phone-shell">
    <div class="notch"></div>
    <div class="status-bar bg-white/95"><span>16:22</span><div class="flex gap-1"><i class="fa-solid fa-signal"></i><span>5G</span><i class="fa-solid fa-battery-full"></i></div></div>
    <div class="safe-content px-4 pt-4 pb-4">
      <div class="flex items-center justify-between">
        <h1 class="page-title">交易明细查询</h1>
        <a href="./customer-center.html" class="text-sm text-blue-600">返回</a>
      </div>

      <div class="mt-3 bg-white rounded-2xl p-4 shadow-sm text-sm space-y-3">
        <div>
          <p class="text-xs text-slate-500 mb-1">账号</p>
          <input id="txn-acct" class="w-full rounded-xl border border-slate-200 p-3" placeholder="输入账号后4位或完整账号" />
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <p class="text-xs text-slate-500 mb-1">开始日期</p>
            <input id="txn-start" type="date" class="w-full rounded-xl border border-slate-200 p-3" />
          </div>
          <div>
            <p class="text-xs text-slate-500 mb-1">结束日期</p>
            <input id="txn-end" type="date" class="w-full rounded-xl border border-slate-200 p-3" />
          </div>
        </div>
        <button id="txn-query-btn" class="w-full py-3 rounded-xl bg-blue-600 text-white">查询</button>
      </div>
    </div>
    <div class="tab-bar">
      <a class="tab-item" href="./workbench.html"><i class="fa-solid fa-table-columns text-lg"></i><div>工作台</div></a>
      <a class="tab-item active" href="./customer-center.html"><i class="fa-regular fa-user text-lg"></i><div>客户中心</div></a>
      <a class="tab-item" href="./marketing-center.html"><i class="fa-solid fa-bullhorn text-lg"></i><div>营销中心</div></a>
      <a class="tab-item" href="./process-center.html"><i class="fa-solid fa-diagram-project text-lg"></i><div>流程中心</div></a>
      <a class="tab-item" href="./management-center.html"><i class="fa-solid fa-gear text-lg"></i><div>管理中心</div></a>
      <a class="tab-item" href="./parameter-center.html"><i class="fa-solid fa-sliders text-lg"></i><div>参数中心</div></a>
    </div>
  </div>
  <script>
    document.getElementById('txn-query-btn')?.addEventListener('click', () => {
      const account = document.getElementById('txn-acct')?.value || '';
      const startDate = document.getElementById('txn-start')?.value || '';
      const endDate = document.getElementById('txn-end')?.value || '';
      const q = new URLSearchParams();
      if (account) q.set('account', account);
      if (startDate) q.set('startDate', startDate);
      if (endDate) q.set('endDate', endDate);
      window.location.href = `./transaction-detail-result.html?${q.toString()}`;
    });
  </script>
</body>
</html>
