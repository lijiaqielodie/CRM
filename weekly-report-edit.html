<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>周报生成与编辑</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="bg-[#e8ecf3] min-h-screen flex items-center justify-center p-6">
  <div class="phone-shell">
    <div class="notch"></div>
    <div class="status-bar bg-white/95"><span>16:22</span><div class="flex gap-1"><i class="fa-solid fa-signal"></i><span>5G</span><i class="fa-solid fa-battery-full"></i></div></div>
    <div class="safe-content px-4 pt-4 pb-4 overflow-y-auto">
      <div class="flex items-center justify-between">
        <h1 class="page-title">周报编辑</h1>
        <a href="./weekly-report.html" class="text-sm text-blue-600">返回</a>
      </div>
      <p class="mt-2 text-xs text-slate-500">周期：2026.04.22 - 2026.04.28 · 数据源：个人日程记录 + 客户拜访数据 + 信贷系统业务办理数据</p>

      <div class="mt-3 flex gap-2 text-xs">
        <button class="px-3 py-1.5 rounded-full bg-indigo-600 text-white">一键生成草稿</button>
        <button class="px-3 py-1.5 rounded-full bg-slate-100 text-slate-600">重新生成</button>
      </div>

      <div class="mt-3 space-y-3 text-sm">
        <section class="bg-white rounded-xl border border-slate-100 p-3">
          <p class="font-semibold text-slate-800">本周工作概要</p>
          <textarea class="mt-2 w-full rounded-lg border border-slate-200 p-2 h-24">本周完成重点客户走访12户，组织内部项目评审2次，推进授信资料补充与流程提速。</textarea>
        </section>
        <section class="bg-white rounded-xl border border-slate-100 p-3">
          <p class="font-semibold text-slate-800">客户拜访情况统计</p>
          <textarea class="mt-2 w-full rounded-lg border border-slate-200 p-2 h-20">拜访客户12户，其中重点客户5户；形成营销机会4条，跟进中3条。</textarea>
        </section>
        <section class="bg-white rounded-xl border border-slate-100 p-3">
          <p class="font-semibold text-slate-800">业务办理进展</p>
          <textarea class="mt-2 w-full rounded-lg border border-slate-200 p-2 h-20">信贷审批推进8笔，已落地2笔，资料补件3笔，待风控会签3笔。</textarea>
        </section>
        <section class="bg-white rounded-xl border border-slate-100 p-3">
          <p class="font-semibold text-slate-800">重点客户维护情况</p>
          <textarea class="mt-2 w-full rounded-lg border border-slate-200 p-2 h-20">完成社保基金、科创集团等重点客户回访，明确下周拜访计划与产品方案。</textarea>
        </section>
        <section class="bg-white rounded-xl border border-slate-100 p-3">
          <p class="font-semibold text-slate-800">下周工作计划</p>
          <textarea class="mt-2 w-full rounded-lg border border-slate-200 p-2 h-20" placeholder="请填写下周计划..."></textarea>
        </section>
        <section class="bg-white rounded-xl border border-slate-100 p-3">
          <div class="flex items-center justify-between">
            <p class="font-semibold text-slate-800">需要上级协助解决的问题</p>
            <a href="./issue-tracking.html" class="text-xs text-blue-600">进入问题上报与协作</a>
          </div>
          <textarea class="mt-2 w-full rounded-lg border border-slate-200 p-2 h-24" placeholder="此部分需人工详细描述：问题背景、影响范围、已尝试动作、期望协助..."></textarea>
          <div class="mt-2 grid grid-cols-3 gap-2 text-xs">
            <select class="rounded-lg border border-slate-200 px-2 py-2">
              <option>问题分类</option>
              <option>业务支持</option>
              <option>资源协调</option>
              <option>技术问题</option>
              <option>政策咨询</option>
            </select>
            <select class="rounded-lg border border-slate-200 px-2 py-2">
              <option>优先级</option>
              <option>高</option>
              <option>中</option>
              <option>低</option>
            </select>
            <input class="rounded-lg border border-slate-200 px-2 py-2" placeholder="关联客户/项目" />
          </div>
        </section>
      </div>

      <div class="mt-4 grid grid-cols-2 gap-2 text-sm">
        <button class="py-3 rounded-xl bg-slate-100 text-slate-700">保存草稿</button>
        <button class="py-3 rounded-xl bg-blue-600 text-white">正式提交</button>
      </div>
    </div>
    <div class="tab-bar">
      <a class="tab-item active" href="./workbench.html"><i class="fa-solid fa-table-columns text-lg"></i><div>工作台</div></a>
      <a class="tab-item" href="./customer-center.html"><i class="fa-regular fa-user text-lg"></i><div>客户中心</div></a>
      <a class="tab-item" href="./marketing-center.html"><i class="fa-solid fa-bullhorn text-lg"></i><div>营销中心</div></a>
      <a class="tab-item" href="./process-center.html"><i class="fa-solid fa-diagram-project text-lg"></i><div>流程中心</div></a>
      <a class="tab-item" href="./management-center.html"><i class="fa-solid fa-gear text-lg"></i><div>管理中心</div></a>
      <a class="tab-item" href="./parameter-center.html"><i class="fa-solid fa-sliders text-lg"></i><div>参数中心</div></a>
    </div>
  </div>
</body>
</html>
