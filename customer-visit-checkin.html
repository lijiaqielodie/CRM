<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>拜访详情</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="bg-[#e8ecf3] min-h-screen flex items-center justify-center p-6">
  <div class="phone-shell">
    <div class="notch"></div>
    <div class="status-bar bg-white/95"><span>13:53</span><div class="flex gap-1"><i class="fa-solid fa-signal"></i><span>5G</span><i class="fa-solid fa-battery-full"></i></div></div>
    <div class="safe-content bg-[#f4f5f7] overflow-y-auto">
      <div class="px-4 pt-3 pb-2 bg-white border-b border-slate-100">
        <div class="flex items-center justify-between">
          <a href="./customer-visit.html?tab=mine" class="text-slate-700"><i class="fa-solid fa-angle-left"></i></a>
          <h1 class="text-[18px] font-semibold text-slate-800">拜访详情</h1>
          <span class="w-4"></span>
        </div>
      </div>
      <div class="px-3 py-3">
        <div class="bg-white rounded-2xl border border-slate-100 p-3">
          <h2 class="text-[28px] font-semibold text-slate-800 border-l-[3px] border-sky-400 pl-2">拜访信息</h2>
          <div class="mt-2 text-[15px] space-y-1.5">
            <div class="grid grid-cols-[96px_1fr]"><span class="text-slate-500">客户名称</span><span class="text-right text-slate-800">上海市社保基金</span></div>
            <div class="grid grid-cols-[96px_1fr]"><span class="text-slate-500">拜访人</span><span class="text-right text-slate-800">李佳琪</span></div>
            <div class="grid grid-cols-[96px_1fr]"><span class="text-slate-500">拜访日期</span><span class="text-right text-slate-800">2026.04.29</span></div>
            <div class="grid grid-cols-[96px_1fr]"><span class="text-slate-500">拜访时间</span><span class="text-right text-slate-800">08:30–10:00</span></div>
          </div>
        </div>
        <div class="mt-3 bg-white rounded-2xl border border-slate-100 p-3">
          <div class="flex items-center justify-between text-[16px]">
            <div class="text-slate-800"><i class="fa-solid fa-location-dot mr-1"></i>上海市 上海银行(数据处理中⼼)</div>
            <button class="px-2 py-0.5 rounded-full border border-sky-300 text-sky-500 text-[12px]">重新定位</button>
          </div>
          <img src="./assets/c__Users_Administrator_AppData_Roaming_Cursor_User_workspaceStorage_f9fa7236509743ebec2f85105b34f7a8_images_image-9a3a2036-abf4-4378-a54e-13167d58ebf1.png" class="mt-2 rounded-lg h-[210px] w-full object-cover" alt="map" />
          <div class="mt-4 flex justify-center">
            <button id="checkin-btn" class="w-[170px] h-[170px] rounded-full bg-blue-500 text-white shadow-[0_0_0_10px_rgba(59,130,246,0.18)]">
              <div class="text-[32px] font-semibold leading-none">签到</div>
              <div id="checkin-time" class="mt-1 text-[24px]">13:53:07</div>
            </button>
          </div>
          <p class="mt-3 text-center text-[15px] text-slate-700">约定地点：上海市上海银行(数据处理中心)</p>
        </div>
      </div>
    </div>
  </div>
  <script>
    document.getElementById('checkin-btn').addEventListener('click', (e) => {
      e.currentTarget.classList.remove('bg-blue-500');
      e.currentTarget.classList.add('bg-emerald-500');
      e.currentTarget.querySelector('div').textContent = '已签到';
    });
  </script>
</body>
</html>
