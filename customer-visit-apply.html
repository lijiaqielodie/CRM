<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>外出拜访申请</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="bg-[#e8ecf3] min-h-screen flex items-center justify-center p-6">
  <div class="phone-shell">
    <div class="notch"></div>
    <div class="status-bar bg-white/95"><span>14:01</span><div class="flex gap-1"><i class="fa-solid fa-signal"></i><span>5G</span><i class="fa-solid fa-battery-full"></i></div></div>
    <div class="safe-content bg-[#f4f5f7] overflow-hidden flex flex-col">
      <div class="px-4 pt-3 pb-2 bg-white border-b border-slate-100">
        <div class="flex items-center justify-between">
          <a href="./customer-visit.html?tab=apply" class="text-slate-700"><i class="fa-solid fa-angle-left"></i></a>
          <h1 class="text-[18px] font-semibold text-slate-800">外出拜访申请</h1>
          <span class="w-4"></span>
        </div>
      </div>
      <div class="bg-blue-500 h-4"></div>
      <div class="flex-1 min-h-0 overflow-y-auto px-3 pb-3">
        <div class="bg-white rounded-2xl mt-2 p-4 border border-slate-100">
          <h2 class="text-[28px] font-semibold text-slate-900">拜访信息</h2>
          <div class="mt-3 space-y-2 text-[15px]">
            <div class="grid grid-cols-[95px_1fr_auto] items-center py-1.5 border-b border-slate-100">
              <span class="text-slate-900">客户名称</span>
              <input id="customer-name" class="outline-none text-slate-700 placeholder:text-slate-300" placeholder="请输入客户名称或选择客户" value="" />
              <button class="text-slate-600"><i class="fa-solid fa-users"></i></button>
            </div>
            <p class="text-[12px] text-slate-400 -mt-1 mb-1">提示：拜访行内客户（含非管户客户）可从右侧列表中选择</p>
            <div class="grid grid-cols-[95px_1fr_auto] items-center py-1.5 border-b border-slate-100">
              <span class="text-slate-900">客户类型</span><span class="text-slate-300">请选择</span><i class="fa-solid fa-angle-right text-slate-400"></i>
            </div>
            <div class="grid grid-cols-[95px_1fr_auto] items-center py-1.5 border-b border-slate-100">
              <span class="text-slate-900">所属集团</span><span class="text-slate-300">请选择</span><i class="fa-solid fa-angle-right text-slate-400"></i>
            </div>
            <div class="grid grid-cols-[95px_1fr_auto] items-center py-1.5 border-b border-slate-100">
              <span class="text-slate-900">拜访日期</span><span class="text-slate-300">请选择</span><i class="fa-solid fa-angle-right text-slate-400"></i>
            </div>
            <div class="grid grid-cols-[95px_1fr_auto] items-center py-1.5 border-b border-slate-100">
              <span class="text-slate-900">拜访时间</span><span class="text-slate-300">请选择</span><i class="fa-solid fa-angle-right text-slate-400"></i>
            </div>
            <div class="grid grid-cols-[95px_1fr_auto] items-center py-1.5 border-b border-slate-100">
              <span class="text-slate-900">拜访事由</span><span class="text-slate-300">请选择</span><i class="fa-solid fa-angle-right text-slate-400"></i>
            </div>
            <div class="grid grid-cols-[95px_1fr_auto] items-center py-1.5 border-b border-slate-100">
              <span class="text-slate-900">访谈地点</span><span class="text-slate-300">请输入完整地址或选择地址</span><i class="fa-solid fa-angle-right text-slate-400"></i>
            </div>
            <div class="grid grid-cols-[95px_1fr] items-center py-1.5">
              <span class="text-slate-900">我行参与人</span><span class="text-slate-300">请输入</span>
            </div>
            <button class="w-full text-center text-blue-400 py-1"><i class="fa-solid fa-plus"></i> 添加</button>
            <div class="grid grid-cols-[95px_1fr] items-center py-1.5">
              <span class="text-slate-900">行外参与人</span><span class="text-slate-300">请输入</span>
            </div>
            <button class="w-full text-center text-blue-400 py-1"><i class="fa-solid fa-plus"></i> 添加</button>
          </div>
        </div>
      </div>
      <div class="px-3 pb-3">
        <button id="submit-btn" type="button" class="w-full h-12 rounded-full bg-blue-500 text-white text-lg">提交</button>
      </div>
    </div>
  </div>

  <div id="gen-modal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50">
    <div class="w-[340px] bg-white rounded-2xl overflow-hidden">
      <div class="px-5 py-4 text-center border-b border-slate-100">
        <h3 class="text-[18px] font-semibold text-slate-800">温馨提示</h3>
        <p class="mt-2 text-base text-slate-700 leading-tight">是否生成该客户的访前一页纸？访前一页纸可用于拜访前快速对客户进行调查和评估哦～</p>
      </div>
      <div class="grid grid-cols-2 text-center text-lg">
        <button id="btn-no" class="py-3 text-slate-700 border-r border-slate-100">不需要</button>
        <button id="btn-gen" class="py-3 text-blue-500">生成</button>
      </div>
    </div>
  </div>
  <script>
    const modal = document.getElementById('gen-modal');
    document.getElementById('submit-btn').addEventListener('click', () => {
      modal.classList.remove('hidden');
    });
    document.getElementById('btn-no').addEventListener('click', () => {
      window.location.href = './customer-visit.html?tab=apply';
    });
    document.getElementById('btn-gen').addEventListener('click', () => {
      const name = encodeURIComponent(document.getElementById('customer-name').value.trim());
      window.location.href = name ? `./pre-visit-onepager.html?q=${name}` : './pre-visit-onepager.html';
    });
  </script>
</body>
</html>
