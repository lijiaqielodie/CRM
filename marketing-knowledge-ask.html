<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>专家问答 · 提问</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="bg-[#e8ecf3] min-h-screen flex items-center justify-center p-6">
  <!-- 对齐 assets/knowledge3.jpg：提问表单 -->
  <div class="phone-shell">
    <div class="notch"></div>
    <div class="status-bar bg-white/95"><span>10:09</span><div class="flex gap-1"><i class="fa-solid fa-signal"></i><span>5G</span><i class="fa-solid fa-battery-full"></i></div></div>
    <div class="safe-content px-4 pt-3 pb-6 overflow-y-auto bg-white" style="height: calc(100% - 44px);">
      <div class="flex items-center gap-2 mb-6">
        <a href="./marketing-knowledge.html?tab=qa" class="text-slate-800 text-xl leading-none"><i class="fa-solid fa-angle-left"></i></a>
        <h1 class="flex-1 text-center font-semibold text-[17px] text-slate-900">专家问答</h1>
        <span class="w-7"></span>
      </div>

      <div class="space-y-5">
        <div>
          <label class="block text-[15px] font-medium text-slate-900 mb-2">问题名称</label>
          <input type="text" placeholder="请输入关键字" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-[14px] outline-none focus:border-blue-400" />
        </div>
        <div>
          <label class="block text-[15px] font-medium text-slate-900 mb-2">问题分类</label>
          <button type="button" id="pick-cat" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-left text-[14px] text-slate-400 flex items-center justify-between">
            <span>请选择问题分类</span>
            <i class="fa-solid fa-chevron-right text-slate-300 text-sm"></i>
          </button>
        </div>
        <div>
          <label class="block text-[15px] font-medium text-slate-900 mb-2">问题说明</label>
          <textarea rows="8" maxlength="1000" placeholder="请输入问题说明，1000字以内" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-[14px] outline-none focus:border-blue-400 resize-none leading-relaxed"></textarea>
          <p class="text-right text-[11px] text-slate-400 mt-1">0 / 1000</p>
        </div>
        <button type="button" class="w-28 h-28 rounded-2xl border-2 border-dashed border-slate-200 bg-slate-50 flex items-center justify-center text-slate-400 text-3xl active:bg-slate-100">
          <i class="fa-solid fa-plus"></i>
        </button>
      </div>

      <button type="button" id="btn-submit" class="mt-10 w-full rounded-full bg-slate-100 border border-slate-200 py-3.5 text-[16px] text-slate-500 font-medium active:bg-slate-200">
        提交
      </button>
    </div>
  </div>
  <script>
    document.getElementById('pick-cat').addEventListener('click', () => alert('请选择分类（示意弹窗）'));
    const ta = document.querySelector('textarea');
    const hint = ta.nextElementSibling;
    ta.addEventListener('input', () => {
      hint.textContent = `${ta.value.length} / 1000`;
    });
    document.getElementById('btn-submit').addEventListener('click', () => {
      alert('提交成功（示意）');
      location.href = './marketing-knowledge.html?tab=qa';
    });
  </script>
</body>
</html>
