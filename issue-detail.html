<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>问题详情</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="bg-[#e8ecf3] min-h-screen flex items-center justify-center p-6">
  <div class="phone-shell">
    <div class="notch"></div>
    <div class="status-bar bg-white/95"><span>16:22</span><div class="flex gap-1"><i class="fa-solid fa-signal"></i><span>5G</span><i class="fa-solid fa-battery-full"></i></div></div>
    <div class="safe-content px-4 pt-4 pb-4 overflow-y-auto">
      <div class="flex items-center justify-between">
        <h1 class="page-title">问题详情</h1>
        <a href="./issue-tracking.html" class="text-sm text-blue-600">返回</a>
      </div>
      <div class="mt-3 bg-white rounded-xl border border-slate-100 p-3 text-sm">
        <p class="font-semibold text-slate-800">政策咨询：园区贴息口径不一致</p>
        <p class="text-xs text-slate-500 mt-1">分类：政策咨询 · 优先级：高 · 状态：待处理</p>
        <p class="text-xs text-slate-500 mt-1">关联客户：上海市社保基金</p>
        <p class="mt-2 text-slate-700 text-sm leading-relaxed">问题描述：园区贴息适用期限在支行和分行口径不一致，影响客户方案落地，请协助确认统一标准。</p>
      </div>

      <div class="mt-3 bg-white rounded-xl border border-slate-100 p-3">
        <p class="font-semibold text-slate-800 text-sm">上级指导反馈</p>
        <div class="mt-2 space-y-2 text-xs">
          <div class="rounded-lg bg-slate-50 border border-slate-100 p-2">
            <p class="text-slate-700"><span class="font-medium">张主管：</span>请先整理现有两版口径差异，@政策岗同步确认后给客户统一回复。</p>
            <p class="mt-1 text-slate-400">2026-04-28 18:06</p>
          </div>
          <div class="rounded-lg bg-slate-50 border border-slate-100 p-2">
            <p class="text-slate-700"><span class="font-medium">李佳琪：</span>已整理差异清单，@政策岗 @产品经理 协同处理。</p>
            <p class="mt-1 text-slate-400">2026-04-28 18:20</p>
          </div>
        </div>
      </div>

      <div class="mt-3 bg-white rounded-xl border border-slate-100 p-3">
        <p class="font-semibold text-slate-800 text-sm">协作评论</p>
        <textarea class="mt-2 w-full rounded-lg border border-slate-200 p-2 text-xs h-20" placeholder="@相关人员，输入反馈或处理建议"></textarea>
        <button class="mt-2 w-full py-2.5 rounded-lg bg-blue-600 text-white text-sm">发表评论</button>
      </div>
    </div>
    <div class="tab-bar">
      <a class="tab-item active" href="./workbench.html"><i class="fa-solid fa-table-columns text-lg"></i><div>工作台</div></a>
      <a class="tab-item" href="./customer-center.html"><i class="fa-regular fa-user text-lg"></i><div>客户中心</div></a>
      <a class="tab-item" href="./marketing-center.html"><i class="fa-solid fa-bullhorn text-lg"></i><div>营销中心</div></a>
      <a class="tab-item" href="./process-center.html"><i class="fa-solid fa-diagram-project text-lg"></i><div>流程中心</div></a>
      <a class="tab-item" href="./management-center.html"><i class="fa-solid fa-gear text-lg"></i><div>管理中心</div></a>
      <a class="tab-item" href="./parameter-center.html"><i class="fa-solid fa-sliders text-lg"></i><div>参数中心</div></a>
    </div>
  </div>
</body>
</html>
