<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>客户拜访</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="bg-[#e8ecf3] min-h-screen flex items-center justify-center p-6">
  <div class="phone-shell">
    <div class="notch"></div>
    <div class="status-bar bg-white/95"><span>13:53</span><div class="flex gap-1"><i class="fa-solid fa-signal"></i><span>5G</span><i class="fa-solid fa-battery-full"></i></div></div>
    <div class="safe-content bg-[#f4f5f7] overflow-y-auto">
      <div class="px-4 pt-3 pb-2 bg-white border-b border-slate-100">
        <div class="flex items-center justify-between">
          <a href="./customer-visit.html?tab=view" class="text-slate-700"><i class="fa-solid fa-angle-left"></i></a>
          <h1 class="text-[18px] font-semibold text-slate-800">客户拜访</h1>
          <span class="w-4"></span>
        </div>
      </div>
      <div class="px-3">
        <div class="bg-white py-3 px-1 border-b border-slate-100">
          <h2 class="text-[22px] font-semibold text-slate-900 px-2">峨眉电影集团有限公司</h2>
          <div class="mt-2 px-2 flex items-center justify-between text-[17px]">
            <span class="text-slate-500">拜访总次数</span>
            <span class="text-slate-800">28</span>
          </div>
        </div>

        <div id="timeline-list" class="py-2"></div>
      </div>
    </div>
  </div>
  <script>
    const timeline = [
      { time: '2026-04-28 15:00:00', applicant: '魏莱', location: '四川省成都市青羊区清江东路360号' },
      { time: '2026-04-28 15:00:00', applicant: '魏莱', location: '四川省成都市青羊区清江东路360号' },
      { time: '2026-04-27 15:00:00', applicant: '周一松', location: '四川省成都市青羊区清江东路360号' },
      { time: '2026-04-27 15:00:00', applicant: '周一松', location: '四川省成都市青羊区清江东路360号' },
    ];

    document.getElementById('timeline-list').innerHTML = timeline.map((item, idx) => `
      <div class="relative pl-6 pb-3">
        <span class="absolute left-1 top-2 w-3 h-3 rounded-full border-2 ${idx === 0 ? 'border-blue-500 bg-white' : 'border-slate-400 bg-white'}"></span>
        ${idx < timeline.length - 1 ? '<span class="absolute left-[10px] top-5 bottom-0 w-[1px] bg-slate-300"></span>' : ''}
        <p class="text-[15px] text-slate-500">${item.time}</p>
        <div class="mt-1 bg-white rounded-xl border border-slate-100 p-3">
          <div class="flex items-center gap-2">
            <span class="text-[28px] font-semibold text-slate-900 leading-none">拜访主题</span>
            <span class="px-2 py-0.5 text-[14px] rounded border border-slate-300 text-slate-500">无纪要</span>
          </div>
          <div class="mt-2 text-[15px]">
            <div class="grid grid-cols-[82px_1fr] py-1"><span class="text-slate-500">拜访申请人</span><span class="text-right text-slate-800">${item.applicant}</span></div>
            <div class="grid grid-cols-[82px_1fr] py-1"><span class="text-slate-500">访谈地点</span><span class="text-slate-800">${item.location}</span></div>
          </div>
        </div>
      </div>
    `).join('');
  </script>
</body>
</html>
