            <span class="reminder-dot w-2 h-2 mt-2 rounded-full bg-blue-600"></span>
            <div class="flex-1 min-w-0">
              <p class="font-medium text-slate-800 truncate">业务管理：电子函证处理时效提醒</p>
              <p class="text-xs text-slate-500 truncate">关联客户：华兴科技集团</p>
            </div>

          </a>
          <a href="./reminder-detail.html?id=R20260423001" data-read="false" class="reminder-item w-full text-left flex items-start gap-2 p-2 rounded-lg bg-blue-50">
            <span class="reminder-dot w-2 h-2 mt-2 rounded-full bg-blue-600"></span>
            <div class="flex-1 min-w-0">
              <p class="font-medium text-slate-800 truncate">营销商机：现金管理方案客户点击率上升</p>
              <p class="text-xs text-slate-500 truncate">关联客户：华达连锁商贸</p>
            </div>
            <span class="text-xs text-slate-400">08:55</span>
          </a>

    <div class="tab-bar">
      <a class="tab-item active" href="./workbench.html"><i class="fa-solid fa-table-columns text-lg"></i><div>工作台</div></a>
      <a class="tab-item" href="./customer-center.html"><i class="fa-regular fa-user text-lg"></i><div>客户中心</div></a>

      <a class="tab-item" href="./process-center.html"><i class="fa-solid fa-diagram-project text-lg"></i><div>流程中心</div></a>

      <a class="tab-item" href="./parameter-center.html"><i class="fa-solid fa-sliders text-lg"></i><div>参数中心</div></a>
    </div>
  </div>
  <script>
    const reminderList = document.getElementById('reminder-list-page');
    const markAllRead = document.getElementById('mark-all-read-page');

    function normalizeReminders() {
      const items = Array.from(reminderList.querySelectorAll('.reminder-item'));
      items.sort((a, b) => (a.dataset.read === 'false' && b.dataset.read === 'true' ? -1 : a.dataset.read === b.dataset.read ? 0 : 1));
      items.forEach((item) => reminderList.appendChild(item));
      items.forEach((item) => {
        const isRead = item.dataset.read === 'true';
        const dot = item.querySelector('.reminder-dot');
        item.classList.toggle('bg-blue-50', !isRead);
        item.classList.toggle('bg-slate-50', isRead);
        dot.classList.toggle('bg-blue-600', !isRead);
        dot.classList.toggle('bg-transparent', isRead);
        const title = item.querySelector('p');
        title.classList.toggle('text-slate-800', !isRead);
        title.classList.toggle('text-slate-700', isRead);
      });
    }

    reminderList.querySelectorAll('.reminder-item').forEach((item) => {
      item.addEventListener('click', (event) => {
        event.preventDefault();
        item.dataset.read = 'true';
        normalizeReminders();
        const targetUrl = item.getAttribute('href');
        setTimeout(() => {
          window.location.href = targetUrl;
        }, 120);
      });
    });

    markAllRead.addEventListener('click', () => {
      reminderList.querySelectorAll('.reminder-item').forEach((item) => {
        item.dataset.read = 'true';
      });
      normalizeReminders();
    });

    normalizeReminders();
  </script>
</body>
</html>
